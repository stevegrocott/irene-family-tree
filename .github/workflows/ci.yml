name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Blocking gate ──────────────────────────────────────────────────────────
  # Both of these are green on main today, so they can fail the build from day
  # one without pinning CI red.
  test:
    name: Unit tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npx jest --ci

      # The app is fully dynamic (every route renders on demand), so the build
      # needs these variables present but never connects to a real database.
      - name: Production build
        run: npx next build
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: ci
          NEO4J_PASSWORD: ci-placeholder
          AUTH_SECRET: ci-placeholder-secret
          AUTH_GOOGLE_ID: ci-placeholder-id
          AUTH_GOOGLE_SECRET: ci-placeholder-secret

  # ── Advisory gate ──────────────────────────────────────────────────────────
  # main currently carries 15 tsc errors and 5 eslint errors (see #204). These
  # steps therefore report without failing the build.
  #
  # WHEN #204 LANDS: delete both `continue-on-error` lines below. That single
  # change is what converts this job into a real gate — leaving them in place
  # means type and lint regressions ship silently, which is the state the repo is
  # in today.
  types-and-lint:
    name: Types & lint (advisory until #204)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit
        continue-on-error: true   # remove when #204 lands

      - name: ESLint
        run: npx eslint src scripts
        continue-on-error: true   # remove when #204 lands
